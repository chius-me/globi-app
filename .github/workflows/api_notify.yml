name: Notify Backend on API Changes

on:
  push:
    branches:
      - main
    paths:
      - 'docs/API_REQUIREMENTS.md'

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Get commit message
        id: log
        run: echo "commit_msg=$(git log -1 --pretty=format:'%s')" >> $GITHUB_ENV

      - name: Send Telegram Notification
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          if [ -z "$TG_BOT_TOKEN" ] || [ -z "$TG_CHAT_ID" ]; then
            echo "Error: TG_BOT_TOKEN or TG_CHAT_ID secret is missing!"
            exit 1
          fi
          
          curl -s -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
            -H "Content-Type: application/json" \
            -d '{
              "chat_id": "'"${TG_CHAT_ID}"'",
              "parse_mode": "Markdown",
              "text": "📢 *前端更新了 API 需求文档！*\n\n*提交说明*: ${{ env.commit_msg }}\n\n👉 [点击这里查看最新契约](https://github.com/${{ github.repository }}/blob/main/docs/API_REQUIREMENTS.md)"
            }'
