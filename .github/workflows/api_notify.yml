name: Notify Backend on API Changes

on:
  push:
    branches:
      - main
    paths:
      - 'docs/API_REQUIREMENTS.md'

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Get commit message
        id: log
        run: |
          {
            echo 'commit_msg<<EOF'
            git log -1 --pretty=format:'%s'
            echo
            echo 'EOF'
          } >> "$GITHUB_ENV"

      - name: Send Telegram Notification
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          set -eu
          if [ -z "$TG_BOT_TOKEN" ] || [ -z "$TG_CHAT_ID" ]; then
            echo "Error: TG_BOT_TOKEN or TG_CHAT_ID secret is missing!"
            exit 1
          fi

          message=$(printf '前端更新了 API 需求文档！\n\n提交说明: %s\n\n查看最新契约: https://github.com/%s/blob/main/docs/API_REQUIREMENTS.md' "$commit_msg" "$GITHUB_REPOSITORY")
          payload=$(jq -n --arg chat_id "$TG_CHAT_ID" --arg text "$message" '{chat_id: $chat_id, text: $text}')

          curl --fail-with-body -s -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
            -H "Content-Type: application/json" \
            -d "$payload"
